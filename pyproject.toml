[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pica-suite"
dynamic = ["version"]
authors = [
  { name="Prathamesh Deshmukh", email="pdeshmukh@csr.res.in" },
  { name="Sudip Mukherjee", email="sudipm@csr.res.in" },
]
description = "PICA: Advanced High-Precision Transport Measurement Automation with Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [ # Pinned to match requirements.txt for stability
    "numpy>=1.22.4",
    "pandas>=1.4.2",
    "matplotlib>=3.5.2",
    "PyVISA>=1.12.0",
    "PyMeasure>=0.10.0",
    "pyvisa-py>=0.5.3",
    # scipy (~140 MB) is not imported by PICA, so it is not required. Add it
    # back here (and in requirements.txt) if a future module needs fits or
    # interpolation.
    "Pillow>=10.3.0",
    "psutil>=5.9.8",
    "zeroconf>=0.113.0"  # not imported by PICA; pyvisa-py uses it to discover TCPIP/HiSLIP instruments
]

[project.optional-dependencies]
gpib = ["gpib-ctypes>=0.3.0"]

[project.urls]
"Homepage" = "https://github.com/prathameshnium/PICA-Python-Instrument-Control-and-Automation"
"Bug Tracker" = "https://github.com/prathameshnium/PICA-Python-Instrument-Control-and-Automation/issues"
"Documentation" = "https://prathameshnium.github.io/PICA-Python-Instrument-Control-and-Automation/"
"Source" = "https://github.com/prathameshnium/PICA-Python-Instrument-Control-and-Automation"
"Changelog" = "https://github.com/prathameshnium/PICA-Python-Instrument-Control-and-Automation/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

# The release number lives in pica/__init__.py only.
[tool.setuptools.dynamic]
version = {attr = "pica.__version__"}

# Documentation shown by the launcher's Help menu. setup.py copies these
# from the repository root into pica/ at build time; they are gitignored.
[tool.setuptools.package-data]
pica = ["README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "docs/*.md"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pica*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]

[project.scripts]
pica-gui = "pica.main:main"
pica-cli = "pica.cli:main"
