[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pica-suite"
version = "1.0.1"
authors = [
  { name="Prathamesh Deshmukh", email="prathamesh.deshmukh@example.com" },
  { name="Sudip Mukherjee", email="sudipm@csr.res.in" },
]
description = "Python-based Instrument Control and Automation Suite"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "PyVISA",
    "PyMeasure",
    "pyvisa-py",
    "scipy"
]

[project.urls]
"Homepage" = "https://github.com/prathameshnium/PICA-Python-Instrument-Control-and-Automation"
"Bug Tracker" = "https://github.com/prathameshnium/PICA-Python-Instrument-Control-and-Automation/issues"

# This finds the new 'pica' folder automatically
[tool.setuptools.packages.find]
where = ["."]
include = ["pica*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
```

#### Step 2: Fix Asset Paths in `pica/main.py`
Since `main.py` is no longer in the root folder, it might not find the images (logos). Open `pica/main.py` and look for where `ASSET_PATH` or image paths are defined.

Replace hardcoded paths like `"assets/"` with this dynamic path code:

```python
import os
# Get the directory where this file resides (pica/)
BASE_DIR = os.path.dirname(os.path.abspath(__file__))
# Build path to assets relative to this file
ASSET_PATH = os.path.join(BASE_DIR, 'assets')
```

#### Step 3: Install & Test
Run these commands in your terminal to register the new package structure and test it:

```bash
# 1. Install the package in "editable" mode
pip install -e .

# 2. Run the new launcher shim
python run_pica.py