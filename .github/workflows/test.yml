name: Automated Testing

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Get Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"
        cache: "pip"
        cache-dependency-path: |
          pyproject.toml
          requirements.txt

    - name: Install System Dependencies (Tkinter/XVFB)
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk xvfb

    - name: Install Python and Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .

    - name: Run All Tests and Generate Reports
      run: |
        echo "Running tests with coverage within a virtual display..."
        xvfb-run --auto-servernum pytest --cov=. --cov-report=xml --junitxml=junit.xml -o junit_family=legacy tests/

    - name: Upload Coverage Report to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: false

    - name: Upload Test Results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./junit.xml
        fail_ci_if_error: false

  # Windows is the platform the lab PCs run, so the suite must pass there too.
  # Tk ships with the python.org builds setup-python installs, so no virtual
  # display is needed. Coverage is reported from the Linux job only.
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"
        cache: "pip"
        cache-dependency-path: |
          pyproject.toml
          requirements.txt

    - name: Install Python and Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -r requirements.txt
        pip install -e .

    - name: Run All Tests
      run: python -B -m pytest -p no:cacheprovider tests/
