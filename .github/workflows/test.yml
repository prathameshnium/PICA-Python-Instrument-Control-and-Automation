name: Automated Testing

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Get Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"
        cache: "pip"
        cache-dependency-path: |
          pyproject.toml
          requirements.txt

    - name: Install System Dependencies (Tkinter/XVFB)
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk xvfb

    - name: Install Python and Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .

    - name: Run All Tests and Generate Reports
      run: |
        echo "Running tests with coverage within a virtual display..."
        xvfb-run --auto-servernum pytest --cov=. --cov-report=xml --junitxml=junit.xml -o junit_family=legacy tests/

    - name: Upload Coverage Report to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: false

    - name: Upload Test Results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./junit.xml
        report_type: test_results
        fail_ci_if_error: false

  # Windows is the platform the lab PCs run, so the suite must pass there too.
  # Tk ships with the python.org builds setup-python installs, so no virtual
  # display is needed. Coverage is reported from the Linux job only.
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"
        cache: "pip"
        cache-dependency-path: |
          pyproject.toml
          requirements.txt

    - name: Install Python and Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -r requirements.txt
        pip install -e .

    - name: Run All Tests
      run: python -B -m pytest -p no:cacheprovider tests/

  # The Linux claim made to reviewers is "every GUI window opens". This job
  # states exactly that as its own check: tests/test_gui_windows_open_for_real.py
  # runs every launcher program in a fresh interpreter with a REAL tkinter under
  # Xvfb. The full suite above already includes that file; this job isolates it
  # so a GUI regression on Linux is named in the checks list, and it refuses to
  # pass if the test skipped instead of running. Python 3.12 is used here so
  # the newest version the package claims is also exercised.
  gui-smoke-linux:
    name: GUI smoke test (Linux, Xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: "pip"
        cache-dependency-path: |
          pyproject.toml
          requirements.txt

    - name: Install System Dependencies (Tkinter/XVFB)
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk xvfb

    - name: Install Python and Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -r requirements.txt
        pip install -e .

    - name: Open every GUI window under Xvfb
      run: |
        xvfb-run --auto-servernum python -B -m pytest -p no:cacheprovider -v -rs \
          --junitxml=gui-smoke.xml -o junit_family=legacy \
          tests/test_gui_windows_open_for_real.py

    - name: Fail if the windows were skipped instead of opened
      run: |
        python - <<'PY'
        import xml.etree.ElementTree as ET
        root = ET.parse("gui-smoke.xml").getroot()
        suites = root.iter("testsuite")
        tests = skipped = 0
        for s in suites:
            tests += int(s.get("tests", 0)); skipped += int(s.get("skipped", 0))
        print(f"{tests} tests, {skipped} skipped")
        if tests == 0 or skipped:
            raise SystemExit("GUI smoke test did not actually open the windows")
        PY
